name: Pipeline CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Compilar frontend tutor-panel
        run: |
          source ~/.bashrc 2>/dev/null || true
          cd tutor-panel
          npm install
          npm run build

      - name: Desplegar backend con PM2
        run: |
          source ~/.bashrc 2>/dev/null || true
          cd backend
          npm install
          npm run build
          cp ~/backend.env ./.env
          npm run db:migrate
          pm2 delete backend-tesis 2>/dev/null || true
          pm2 start dist/src/index.js --name "backend-tesis"
          pm2 save
